[project]
name = "catchment"
version = "0.1.0"
description = "Plan a quick-commerce store network: where the next N stores should go, and what each one wins or takes from the others."
readme = "README.md"
authors = [
    { name = "Dhruv Kapri", email = "dhruv27kapri@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyproj>=3.8.0",
    "requests>=2.34.2",
    "shapely>=2.2.0",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
]
