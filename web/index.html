<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catchment</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script type="importmap">{ "imports": { "h3-js": "https://esm.sh/h3-js@4" } }</script>
  <style>
    html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; }
    body { display: flex; }
    section { position: relative; flex: 1; }
    .map { position: absolute; inset: 0; }
    .panel { position: absolute; top: 10px; left: 10px; width: 240px; padding: 12px; background: #fff; border-radius: 6px; box-shadow: 0 1px 6px rgba(0, 0, 0, .3); z-index: 1; }
    .panel h2 { margin: 0 0 6px; font-size: 16px; }
    .panel label { display: flex; justify-content: space-between; align-items: center; margin: 4px 0; }
    .panel input { width: 70px; }
    .panel button { width: 100%; margin-top: 8px; padding: 6px; }
    .metrics { margin: 10px 0 0; }
    .metrics dt { color: #555; }
    .metrics dd { margin: 0 0 6px; font-weight: 600; font-size: 18px; }
    .error { color: #b00020; margin-top: 6px; }
    #compare { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2; padding: 8px 12px; background: #fff; border-radius: 6px; box-shadow: 0 1px 6px rgba(0, 0, 0, .3); }
    #diff { border-collapse: collapse; margin-top: 6px; }
    #diff th, #diff td { padding: 2px 10px; text-align: right; }
    #diff th:first-child, #diff td:first-child { text-align: left; }
    .store { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 3px rgba(0, 0, 0, .6); }
    .store-new { background: #1b9e77; }
    .store-operator { background: #7570b3; }
    .store-competitor { background: #d95f02; }
  </style>
</head>
<body>
  <section data-testid="scenario-a"><div class="map" data-testid="map"></div></section>
  <section data-testid="scenario-b"><div class="map" data-testid="map"></div></section>
  <div id="compare">
    <button id="copy-a-to-b" type="button" data-testid="copy-a-to-b">Copy A &rarr; B</button>
    <table id="diff" data-testid="diff"></table>
  </div>
  <template id="panel">
    <div class="panel">
      <h2></h2>
      <form class="levers" data-testid="levers"></form>
      <button class="plan" type="button" data-testid="plan-button">Plan</button>
      <dl class="metrics">
        <dt>Demand covered (orders a day)</dt><dd data-testid="metric-demand">-</dd>
        <dt>Households covered</dt><dd data-testid="metric-households">-</dd>
      </dl>
      <div class="error" data-testid="error"></div>
    </div>
  </template>
  <script type="module" src="js/main.js"></script>
</body>
</html>
