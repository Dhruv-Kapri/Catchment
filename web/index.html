<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catchment</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script type="importmap">{ "imports": { "h3-js": "https://esm.sh/h3-js@4" } }</script>
  <style>
    html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }
    #panel { position: absolute; top: 10px; left: 10px; width: 240px; padding: 12px; background: #fff; border-radius: 6px; box-shadow: 0 1px 6px rgba(0, 0, 0, .3); z-index: 1; max-height: calc(100% - 44px); overflow-y: auto; }
    #panel label { display: flex; justify-content: space-between; align-items: center; margin: 4px 0; }
    #panel input { width: 70px; }
    #panel button { width: 100%; margin-top: 8px; padding: 6px; }
    #metrics-heading { margin: 10px 0 0; font-size: 14px; }
    #plan-note { color: #555; }
    #new-stores { padding-left: 20px; }
    #metrics { margin: 10px 0 0; }
    #metrics dt { color: #555; }
    #metrics dd { margin: 0 0 6px; font-weight: 600; font-size: 16px; }
    #error { color: #b00020; margin-top: 6px; }
    .store { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 3px rgba(0, 0, 0, .6); }
    .store-new { background: #1b9e77; }
    .store-operator { background: #7570b3; }
    .store-competitor { background: #d95f02; }
  </style>
</head>
<body>
  <div id="map" data-testid="map"></div>
  <div id="panel">
    <form id="levers" data-testid="levers"></form>
    <button id="plan" type="button" data-testid="plan-button">Plan</button>
    <h2 id="metrics-heading" data-testid="metrics-heading">Operator's plan, orders a day</h2>
    <dl id="metrics">
      <dt>Demand covered</dt><dd data-testid="metric-demand">-</dd>
      <dt>Households covered</dt><dd data-testid="metric-households">-</dd>
      <dt>Lost to capacity</dt><dd data-testid="metric-lost">-</dd>
      <dt>Unreached</dt><dd data-testid="metric-unreached">-</dd>
      <dt>Slow-traffic coverage</dt><dd data-testid="metric-slow">-</dd>
      <dt>Gap to the solver's bound</dt><dd data-testid="metric-gap">-</dd>
      <dt>Greedy's demand covered</dt><dd data-testid="metric-greedy">-</dd>
      <dt>Gain over greedy</dt><dd data-testid="metric-gain">-</dd>
    </dl>
    <p id="plan-note" data-testid="plan-note"></p>
    <ol id="new-stores" data-testid="new-stores"></ol>
    <div id="error" data-testid="error"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
